name: productchat_studio
description: Conversational AI Studio for Professional Product Photos
publish_to: 'none'
version: 1.0.2+3
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.14
  lottie: ^3.1.3
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  image: ^4.3.0
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  file_picker: ^8.1.6
  permission_handler: ^11.3.1
  dio: ^5.7.0
  crypto: ^3.0.6
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.1.0
  intl: ^0.20.3
  uuid: ^4.5.1
  archive: ^3.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  in_app_purchase_platform_interface: ^1.4.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/recipes/
    - assets/icons/
    - assets/lottie/
    - assets/images/
    - assets/fonts/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: '#6C5CE7'
  adaptive_icon_foreground: assets/icons/app_icon_fg.png
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: '#0A0D14'
    theme_color: '#6C5CE7'

flutter_native_splash:
  color: '#0A0D14'
  image: assets/icons/splash.png
  android_12:
    color: '#0A0D14'
    image: assets/icons/splash.png
  ios: true
  web: true
