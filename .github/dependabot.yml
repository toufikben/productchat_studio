version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "android"

  - package-ecosystem: "bundler"
    directory: "/ios"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ios"
