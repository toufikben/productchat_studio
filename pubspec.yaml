name: productchat_studio
description: Conversational AI Studio for Professional Product Photos
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  image: ^4.3.0
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/recipes/
    - assets/icons/
    - assets/lottie/
