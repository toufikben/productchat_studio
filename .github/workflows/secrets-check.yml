name: Secrets & Hygiene Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for YOUR_ORG placeholder
        run: |
          if grep -r "YOUR_ORG" lib/ --include='*.dart' | grep -v '//'; then exit 1; fi
      - name: Check for keystore files
        run: |
          if find . \( -name '*.jks' -o -name '*.keystore' \) | grep -q .; then exit 1; fi
      - name: Check for Firebase references
        run: |
          if grep -r "firebase" lib/ pubspec.yaml 2>/dev/null; then exit 1; fi
      - name: Check for large files
        run: |
          if find . -type f -size +50M -not -path './.git/*' | grep -q .; then exit 1; fi
