name: Build Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Decode Keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Create key.properties
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Generate ephemeral signing key (fallback)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-key.jks \
            -storepass github-actions \
            -keypass github-actions \
            -alias github-actions \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ProductChat Studio CI, OU=Build, O=ProductChat Studio, C=US"
          cat > android/key.properties << EOF
          storePassword=github-actions
          keyPassword=github-actions
          keyAlias=github-actions
          storeFile=release-key.jks
          EOF

      - name: Build AAB (signed)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android

      - name: Build AAB (fallback-signed)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols
          path: build/symbols/android/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
